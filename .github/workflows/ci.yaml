name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c # v6.0.3
      - uses: actions/setup-python@a309ff8 # v6.2.0
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check --output-format=github
      - run: ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8 # v6.2.0
        with:
          python-version: "3.14"
      
      - name: Install dependencies
        run: pip install -r requirements_dev.txt pytest pytest-cov

      - name: Run tests
        run: pytest tests/  --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}