name: Update Voices on Release

on:
  release:
    types: [published]

jobs:
  update-voices:
    runs-on: ubuntu-latest
    # Skip the entire job if the API key is not configured
    if: ${{ secrets.MINIMAX_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Update voices in const.py
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python update_voices.py --api-key "$MINIMAX_API_KEY" --output update

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/minimax/const.py
          git commit -m "chore: update voice list from MiniMax API for ${{ github.event.release.tag_name }}"
          git push origin HEAD:${{ github.event.release.tag_name }}
