name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Update manifest.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python -c "import json; path='custom_components/minimax/manifest.json'; m=json.load(open(path)); m['version']='$VERSION'; open(path,'w').write(json.dumps(m,indent=2)+'\n')"

      - name: Commit updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/minimax/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Bump manifest version to $VERSION"
            git push origin main
          fi

      - name: Create release zip
        run: |
          cd custom_components/minimax
          zip -r ../../minimax.zip . \
            -x "*/__pycache__/*" "*.pyc" ".DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: minimax.zip
          generate_release_notes: true
