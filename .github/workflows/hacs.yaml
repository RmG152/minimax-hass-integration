name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      # v6.0.3
      - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"